name: CI

# Builds every push to main and every pull request, so a broken build is caught before merging.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-${{ github.sha }}
          path: build/ScreenRec.exe
          retention-days: 14
