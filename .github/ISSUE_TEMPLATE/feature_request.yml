name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: Screenshots or references to other apps are welcome.
